[project]
name = "ai-deflation-check"
version = "0.1.0"
description = "Public-data test of the claim that AI is deflationary"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 120
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["common"]
